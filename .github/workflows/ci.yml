name: CI

on:
  push:
  pull_request:

jobs:
  verify-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:e2e
      - run: pnpm package:dir
      - run: pnpm release:manifest
      - run: pnpm smoke:package
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
